services:
  - type: web
    name: testorbit-api
    runtime: python
    repo: https://github.com/R-Praneshkumar/Test_Orbit_Prod
    rootDir: backend
    buildCommand: python -m pip install --upgrade "pip>=26.2" "setuptools>=83.0.0" && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: REQUIRE_AUTH
        value: "True"
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
    healthCheckPath: /
    plan: starter
