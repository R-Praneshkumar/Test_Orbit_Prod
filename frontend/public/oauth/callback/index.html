<!DOCTYPE html>
<html>

<head>
    <title>TestOrbit — OAuth Callback</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f8fafc;
            color: #334155;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #7c3aed;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Completing authorization...</p>
        <p style="font-size: 13px; color: #94a3b8;">This window will close automatically.</p>
    </div>
    <script>
        // Extract code or error from URL query params
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const errorDescription = params.get('error_description');

        // Send message to parent window (TestOrbit main app)
        if (window.opener) {
            window.opener.postMessage({
                type: 'oauth-callback',
                code: code,
                error: error,
                error_description: errorDescription,
            }, window.location.origin);
        }

        // Close popup after a short delay
        setTimeout(() => window.close(), 1500);
    </script>
</body>

</html>
