[project]
name = "testorbit-backend"
version = "1.0.0"
description = "TestOrbit - AI-Native API Testing Platform Backend (Powered by Google Gemini)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["api-testing", "gemini", "google-ai", "fastapi", "mcp"]
authors = [
    {name = "TestOrbit Team"}
]
dependencies = [
    "aiohttp>=3.13.3",
    "fastapi>=0.128.1",
    "google-genai>=1.62.0",
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "uvicorn>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/your-username/testorbit"
Documentation = "https://github.com/your-username/testorbit/docs"
Repository = "https://github.com/your-username/testorbit"
